<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JurisITU</title><meta name="description" content="JurisITU - painel jurídico da SMJ"><style>html,body{height:100%;margin:0;font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#fff}.load{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:560px}.spin{width:42px;height:42px;border:4px solid #334155;border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#fecaca}</style></head><body><div class="load"><div class="box"><div class="spin"></div><h1>JurisITU</h1><p id="msg">Carregando a versão operacional V6...</p></div></div><script>window.__JURIS_CHUNKS=[];</script><script src="chunk0.js"></script><script src="chunk1.js"></script><script src="chunk2.js"></script><script src="chunk3.js"></script><script src="chunk4.js"></script><script src="chunk5.js"></script><script src="chunk6.js"></script><script src="chunk7.js"></script><script>(async()=>{try{const s=window.__JURIS_CHUNKS.join('');const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('msg').className='err';document.getElementById('msg').textContent='Não foi possível carregar o JurisITU neste navegador. '+e.message;}})();</script></body></html>
