<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JurisITU V8</title><meta name="theme-color" content="#152c3f"><style>html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#102535;color:#fff}.load{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.owl{font-size:52px}.box{max-width:600px}.bar{height:8px;border-radius:99px;background:#28485b;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:72%;background:#7de3bd;animation:p 1.2s ease-in-out infinite alternate}@keyframes p{to{width:94%}}.err{color:#fecaca}</style></head><body><div class="load"><div class="box"><div class="owl">🦉</div><h1>JurisITU</h1><p id="msg">Carregando o protótipo completo V8…</p><div class="bar"><i></i></div></div></div><script>window.__JURIS_CHUNKS=[];</script><script src="chunk0.js"></script><script src="chunk1.js"></script><script src="chunk2.js"></script><script src="chunk3.js"></script><script src="chunk4.js"></script><script src="chunk5.js"></script><script src="chunk6.js"></script><script src="chunk7.js"></script><script>(async()=>{try{const s=window.__JURIS_CHUNKS.join('');const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').className='err';document.getElementById('msg').textContent='Falha ao carregar o JurisITU: '+e.message}})();</script></body></html>
