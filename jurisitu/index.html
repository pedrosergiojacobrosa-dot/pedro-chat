<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JurisITU</title><style>html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#102839;color:#fff}.load{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:560px}.owl{font-size:58px}.spin{width:36px;height:36px;border:4px solid #ffffff33;border-top-color:#fff;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#fecaca}</style></head><body><div class="load"><div class="card"><div class="owl">🦉</div><h1>JurisITU</h1><div class="spin"></div><p id="msg">Carregando o painel operacional...</p></div></div><script>window.__JURISITU_V9=[];</script><script src="app0.js"></script><script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script><script src="app4.js"></script><script src="app5.js"></script><script src="app6.js"></script><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Atualize o Chrome ou Edge para abrir esta versão.');const s=window.__JURISITU_V9.join(''),bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){const m=document.getElementById('msg');m.className='err';m.textContent='Falha ao carregar o JurisITU: '+e.message}})();</script></body></html>
